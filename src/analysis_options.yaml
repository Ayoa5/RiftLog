include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  errors:
    # 抓取层会有大量 dynamic JSON，缺类型不是错误
    avoid_dynamic_calls: ignore

linter:
  rules:
    prefer_single_quotes: true
    always_declare_return_types: true
    unawaited_futures: false
