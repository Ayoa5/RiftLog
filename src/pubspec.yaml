name: hupu_lol
description: LoL 赛事 + 虎扑选手评分（Material You / 莫奈风格，iOS 无签名 ipa）
publish_to: 'none'
version: 1.2.0+3

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

  # 网络
  dio: ^5.7.0
  # HTML / 内嵌 JSON 解析
  html: ^0.15.4
  # 状态管理
  flutter_riverpod: ^2.5.1
  # 日期格式化
  intl: ^0.19.0
  # 莫奈动态取色（Android 生效；iOS 自动回退到 seed 色）
  dynamic_color: ^1.7.0
  # 缓存已发现的比赛编号（避免每次启动都扫号）
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
