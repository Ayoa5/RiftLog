name: Build Unsigned IPA

# 手动触发（推荐）：Actions → Build Unsigned IPA → Run workflow
# 或推送 tag：git tag v1.0.0 && git push --tags
on:
  workflow_dispatch:
    inputs:
      flutter_version:
        description: 'Flutter 版本（留空用 stable 最新）'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-ipa:
    name: Build unsigned .ipa
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 环境信息
        run: |
          echo "=== Xcode ==="
          xcodebuild -version
          echo "=== CocoaPods ==="
          pod --version || true
          echo "=== 目录 ==="
          ls -la

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ github.event.inputs.flutter_version || '' }}
          cache: true

      - name: Flutter 版本
        run: flutter --version

      # 仓库里只提交了 lib/ 与 pubspec，iOS 原生工程由 flutter create 生成
      - name: 生成 iOS 工程（若缺失）
        working-directory: src
        run: |
          if [ ! -d "ios" ]; then
            echo "ios/ 不存在，执行 flutter create 生成"
            flutter create --platforms=ios --org com.hupulol .
          else
            echo "ios/ 已存在，跳过"
          fi
          # flutter create 会生成引用默认 MyApp 的 widget_test.dart，本项目类名是 HupuLolApp，
          # 留着会让 flutter analyze 报 "The name 'MyApp' isn't a class"。仓库里已有真实测试。
          rm -f test/widget_test.dart
          echo "=== ios/ 内容 ==="
          ls -la ios/ || true
          echo "=== test/ 内容 ==="
          ls -la test/ || true

      # 「评」字图标：单尺寸 + iOS 18 深色/着色三态，交给 actool 自动生成其余尺寸
      - name: 应用自定义 AppIcon
        working-directory: src
        run: |
          bash tools/apply_ios_icons.sh
          echo "=== AppIcon 目录 ==="
          ls -la ios/Runner/Assets.xcassets/AppIcon.appiconset/ || true

      # Podfile 由下一步的 flutter build ios --config-only 生成，这里只管依赖
      - name: 安装依赖
        working-directory: src
        run: flutter pub get

      # 静态检查不阻断打包：代码在 CI 之外修改，analyze 失败也要能出包看效果
      - name: 静态分析（不阻断）
        working-directory: src
        continue-on-error: true
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      # 先用 config-only 生成 ios/Podfile、Flutter 资产与 xcconfig（不产出 app）
      # 必须带 --no-codesign：否则 config-only 也会先做证书检查并直接失败
      - name: 生成构建配置（含 Podfile / pod install）
        working-directory: src
        run: |
          flutter build ios --release --config-only --no-codesign
          echo "=== ios/ 内容 ==="
          ls -la ios/ || true
          if [ -f ios/Podfile ]; then
            echo "Podfile 已生成，执行 pod install"
            (cd ios && pod install --repo-update)
          else
            echo "无 Podfile（可能没有原生插件），直接用 Runner.xcodeproj 构建"
          fi
          echo "=== 构建入口 ==="
          if [ -d ios/Runner.xcworkspace ]; then
            echo "WORKSPACE=1"
          else
            echo "WORKSPACE=0"
          fi

      # 直接用 xcodebuild 并显式关闭签名：
      # flutter build ios --no-codesign 在「CI 里 flutter create 出来的工程」上仍会被
      # Xcode 15+ 的 Development Team 校验拦住（DEVELOPMENT_TEAM 为空）。
      - name: Xcode 无签名构建
        working-directory: src
        run: |
          set -o pipefail
          cd ios
          # 双保险：xcconfig 里也关掉签名
          for f in Flutter/Release.xcconfig Flutter/Debug.xcconfig; do
            if [ -f "$f" ] && ! grep -q CODE_SIGNING_ALLOWED "$f"; then
              echo 'CODE_SIGNING_ALLOWED=NO' >> "$f"
            fi
          done
          # 有 Pods 用 workspace，没有就用 project
          if [ -d Runner.xcworkspace ]; then
            ENTRY="-workspace Runner.xcworkspace"
          else
            ENTRY="-project Runner.xcodeproj"
          fi
          echo "构建入口: $ENTRY"
          xcodebuild $ENTRY \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ../build/ios_dd \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build 2>&1 | tee /tmp/xcodebuild.log | tail -60
          echo "=== 产物检查 ==="
          ls -la ../build/ios_dd/Build/Products/Release-iphoneos/ || true

      - name: 打包为 unsigned .ipa
        working-directory: src
        run: |
          set -e
          APP_PATH="build/ios_dd/Build/Products/Release-iphoneos/Runner.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "::error::未找到 $APP_PATH，下面是 xcodebuild 日志尾部"
            tail -80 /tmp/xcodebuild.log || true
            exit 1
          fi

          rm -rf build/ipa_stage
          mkdir -p build/ipa_stage/Payload
          cp -R "$APP_PATH" build/ipa_stage/Payload/

          # 无签名包：不要把 _CodeSignature 带进去（部分安装器会因此报错）
          rm -rf build/ipa_stage/Payload/Runner.app/_CodeSignature

          cd build/ipa_stage
          zip -qry HupuLOL_Unsigned.ipa Payload

          echo "=== 产物 ==="
          ls -lh HupuLOL_Unsigned.ipa
          echo "SHA256:"
          shasum -a 256 HupuLOL_Unsigned.ipa

      - name: 上传 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HupuLOL_Unsigned
          path: src/build/ipa_stage/HupuLOL_Unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: 摘要
        run: |
          {
            echo "## 打包完成"
            echo ""
            echo "- 产物：\`HupuLOL_Unsigned.ipa\`（未签名）"
            echo "- 下载：本页面底部 **Artifacts → HupuLOL_Unsigned**"
            echo "- 安装：Sideloadly / AltStore / TrollStore"
            echo ""
            echo "> 未签名包需要自行签名后才能装到非越狱设备。"
          } >> "$GITHUB_STEP_SUMMARY"
